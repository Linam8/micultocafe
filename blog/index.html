<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog · Culto Café</title>
<meta name="description" content="Guías y novedades sobre café de especialidad en Madrid: cafeterías para trabajar, rutas por barrio y recomendaciones de Culto.">
<link rel="canonical" href="https://micultocafe.netlify.app/blog/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.blog-wrap{max-width:820px}
.blog-lista{display:flex;flex-direction:column;gap:8px;margin-top:28px}
.blog-item{display:block;padding:22px 4px;border-top:1px solid var(--linea)}
.blog-item:first-child{border-top:0}
.blog-item h2{font-size:1.35rem;margin-bottom:6px}
.blog-item .fecha{font-size:.85rem;color:var(--tinta-suave);font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin-bottom:6px}
.blog-item p{color:var(--tinta-suave);margin:0}
.blog-vacio{padding:40px 4px;color:var(--tinta-suave)}
</style>
</head>
<body>

<header class="site-header" id="header">
  <div class="wrap header-inner">
    <a class="logo" href="/" aria-label="Culto Café — inicio"><img src="../assets/img/logo.png" alt="Culto Café"></a>
    <div class="lang" role="group" aria-label="Idioma">
      <a href="/" >Inicio</a>
    </div>
  </div>
</header>

<main>
  <section class="section">
    <div class="wrap blog-wrap">
      <p class="eyebrow">Blog</p>
      <h1 class="balance">Café de especialidad en Madrid: guías y novedades</h1>
      <p>Recomendaciones y contexto sobre cafeterías, barrios y cómo elegimos cada ficha en Culto Café.</p>
      <div class="blog-lista" id="lista" aria-live="polite">
        <p class="blog-vacio">Cargando artículos…</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-base"><p>© 2026 Culto Café</p><p>Madrid · café de especialidad</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
(function(){
  "use strict";
  var SUPABASE_URL="https://wrybrdorgjpctzepierb.supabase.co";
  var SUPABASE_KEY="sb_publishable_cYdvNUZ_5pUkWsmxnmQyMA_4dxs1owY";
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  var fFecha=new Intl.DateTimeFormat("es-ES",{day:"numeric",month:"long",year:"numeric",timeZone:"Europe/Madrid"});
  function fecha(iso){var d=new Date(iso);return isNaN(d)?"":fFecha.format(d)}

  if(!window.supabase){document.getElementById("lista").innerHTML='<p class="blog-vacio">No se pudieron cargar los artículos.</p>';return}
  var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.from("articulos_blog").select("titulo,slug,resumen,fecha_publicacion,created_at")
    .eq("publicado",true).order("fecha_publicacion",{ascending:false}).then(function(r){
      var el=document.getElementById("lista");
      if(r.error||!r.data||!r.data.length){
        el.innerHTML='<p class="blog-vacio">Todavía no hemos publicado ningún artículo. Vuelve pronto.</p>';return;
      }
      el.innerHTML=r.data.map(function(a){
        return '<a class="blog-item" href="post/?slug='+encodeURIComponent(a.slug)+'">'+
          '<div class="fecha">'+fecha(a.fecha_publicacion||a.created_at)+'</div>'+
          '<h2 class="balance">'+esc(a.titulo)+'</h2>'+
          (a.resumen?'<p>'+esc(a.resumen)+'</p>':'')+
        '</a>';
      }).join("");
    });

  var header=document.getElementById("header");
  var on=function(){header.classList.toggle("scrolled",window.scrollY>8)};
  on();window.addEventListener("scroll",on,{passive:true});
})();
</script>
</body>
</html>
